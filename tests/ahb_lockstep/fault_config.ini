# Manual F3c configuration. Keys and sections are case-sensitive. No eval or interpolation.
# Every key is required. Use literal none only where documented. Inactive values never alter injection.
# This is synthetic source injection into the real Guard, not CPU/CoreRTL injection.

[run]
# Purpose: AHB bus parameter set.
# Data type: enum.
# Valid values / range: rv64 (AW=56,DW=64), rv32 (AW=34,DW=32), explicit32 (AW=32,DW=32).
# Unit: none.
# Bit width: AW/DW as listed.
# Example: CONFIGURATION = rv64
# Applicable / optional / ignored: All modes; required.
CONFIGURATION = rv64

# Purpose: Synthetic workload using the real Guard.
# Data type: enum.
# Valid values / range: write_incr8, read_incr8, mixed (8 writes then 8 reads).
# Unit: none.
# Bit width: 8 or 16 AHB beats.
# Example: WORKLOAD = mixed
# Applicable / optional / ignored: All modes; required.
WORKLOAD = write_incr8

# Purpose: Save runtime FST trace.
# Data type: boolean.
# Valid values / range: true or false.
# Unit: none.
# Bit width: 1.
# Example: SAVE_WAVEFORM = true
# Applicable / optional / ignored: All modes; required.
SAVE_WAVEFORM = true

# Purpose: Nominal delay of A before every address presentation.
# Data type: decimal integer.
# Valid values / range: 0 to 32.
# Unit: clock cycles.
# Bit width: 32-bit integer.
# Example: BASE_DELAY_A = 3
# Applicable / optional / ignored: All modes; required; not an injected delay.
BASE_DELAY_A = 0

# Purpose: Nominal delay of B before every address presentation.
# Data type: decimal integer.
# Valid values / range: 0 to 32.
# Unit: clock cycles.
# Bit width: 32-bit integer.
# Example: BASE_DELAY_B = 0
# Applicable / optional / ignored: All modes; required; not an injected delay.
BASE_DELAY_B = 0

# Purpose: Slave data-phase wait states per beat.
# Data type: decimal integer.
# Valid values / range: 0 to 32.
# Unit: clock cycles.
# Bit width: 32-bit integer.
# Example: DOWNSTREAM_WAIT_CYCLES = 2
# Applicable / optional / ignored: All modes; required.
DOWNSTREAM_WAIT_CYCLES = 2

# Purpose: Maximum simulation cycles after reset release.
# Data type: decimal integer.
# Valid values / range: 32 to 100000.
# Unit: clock cycles.
# Bit width: 32-bit integer.
# Example: WATCHDOG_CYCLES = 2000
# Applicable / optional / ignored: All modes; required; timeout is failure.
WATCHDOG_CYCLES = 2000

[fault]
# Purpose: Enable a single manual injection.
# Data type: boolean.
# Valid values / range: true or false.
# Unit: none.
# Bit width: 1.
# Example: FAULT_ENABLE = false
# Applicable / optional / ignored: All modes; required.
FAULT_ENABLE = true

# Purpose: Select the side to modify or delay.
# Data type: enum.
# Valid values / range: A or B.
# Unit: none.
# Bit width: 1.
# Example: FAULT_TARGET = B
# Applicable / optional / ignored: Required; ignored when injection disabled.
FAULT_TARGET = A

# Purpose: Inject only at the TB core-facing Guard inputs.
# Data type: enum.
# Valid values / range: Ingress only; CoreRTL is not implemented.
# Unit: none.
# Bit width: none.
# Example: FAULT_LOCATION = Ingress
# Applicable / optional / ignored: Required in every mode.
FAULT_LOCATION = Ingress

# Purpose: Select the injected effect.
# Data type: enum.
# Valid values / range: Data, Address, Control, Delay.
# Unit: none.
# Bit width: none.
# Example: FAULT_TYPE = Data
# Applicable / optional / ignored: Required; ignored when injection disabled.
FAULT_TYPE = Delay

[data]
# Purpose: Select HWDATA modification.
# Data type: enum or none.
# Valid values / range: bit_flip, replace, xor_mask, none.
# Unit: none.
# Bit width: DATA_WIDTH.
# Example: DATA_MODE = replace
# Applicable / optional / ignored: Required value for Data; none allowed when unused.
DATA_MODE = replace

# Purpose: Replacement HWDATA.
# Data type: hexadecimal string or none.
# Valid values / range: 0x0 to 0xFFFFFFFFFFFFFFFF (64-bit); 0xFFFFFFFF (32-bit).
# Unit: none.
# Bit width: DATA_WIDTH.
# Example: DATA_VALUE = 0x123456789ABCDEF0
# Applicable / optional / ignored: Data/replace only; otherwise ignored; none allowed when unused.
DATA_VALUE = 0x123456789ABCDEF0

# Purpose: Zero-based HWDATA bit to flip.
# Data type: decimal integer or none.
# Valid values / range: 0 to 63 (64-bit); 0 to 31 (32-bit).
# Unit: bit index.
# Bit width: DATA_WIDTH.
# Example: FAULT_BIT = 3
# Applicable / optional / ignored: Data/bit_flip only; otherwise ignored; none allowed when unused.
FAULT_BIT = 3

# Purpose: HWDATA XOR mask.
# Data type: hexadecimal string or none.
# Valid values / range: 0x0 to the DATA_WIDTH unsigned maximum.
# Unit: none.
# Bit width: DATA_WIDTH.
# Example: XOR_MASK = 0x8
# Applicable / optional / ignored: Data/xor_mask only; otherwise ignored; none allowed when unused.
XOR_MASK = 0x8

[address]
# Purpose: Select saved HADDR modification.
# Data type: enum or none.
# Valid values / range: bit_flip, replace, xor_mask, none.
# Unit: none.
# Bit width: ADDR_WIDTH.
# Example: ADDRESS_MODE = bit_flip
# Applicable / optional / ignored: Required value for Address; none allowed when unused.
ADDRESS_MODE = bit_flip

# Purpose: Zero-based HADDR bit to flip.
# Data type: decimal integer or none.
# Valid values / range: 0 to ADDR_WIDTH-1.
# Unit: bit index.
# Bit width: ADDR_WIDTH.
# Example: ADDRESS_BIT = 3
# Applicable / optional / ignored: Address/bit_flip only; otherwise ignored; none allowed when unused.
ADDRESS_BIT = 3

# Purpose: Replacement HADDR; no automatic alignment repair.
# Data type: hexadecimal string or none.
# Valid values / range: 0x0 to (2**ADDR_WIDTH)-1.
# Unit: bytes.
# Bit width: ADDR_WIDTH.
# Example: ADDRESS_VALUE = 0x80001000
# Applicable / optional / ignored: Address/replace only; otherwise ignored; none allowed when unused.
ADDRESS_VALUE = 0x80001000

# Purpose: HADDR XOR mask; unaligned corruption is allowed.
# Data type: hexadecimal string or none.
# Valid values / range: 0x0 to (2**ADDR_WIDTH)-1.
# Unit: none.
# Bit width: ADDR_WIDTH.
# Example: ADDRESS_XOR_MASK = 0x1
# Applicable / optional / ignored: Address/xor_mask only; otherwise ignored; none allowed when unused.
ADDRESS_XOR_MASK = 0x8

[control]
# Purpose: Select one address/control or write-strobe field.
# Data type: enum or none.
# Valid values / range: HWRITE, HSIZE, HBURST, HPROT, HTRANS, HWSTRB, HMASTLOCK, none.
# Unit: none.
# Bit width: 1,3,3,4,2,DATA_WIDTH/8,1 respectively.
# Example: CONTROL_SIGNAL = HSIZE
# Applicable / optional / ignored: Control only; otherwise ignored; none allowed when unused.
CONTROL_SIGNAL = HSIZE

# Purpose: Replace the selected control value.
# Data type: hexadecimal string or none.
# Valid values / range: Unsigned value fitting the selected field; HTRANS 0=IDLE,1=BUSY,2=NONSEQ,3=SEQ; HBURST 0=SINGLE,5=INCR8; HSIZE 0=1B,1=2B,2=4B,3=8B.
# Unit: none.
# Bit width: Selected signal width.
# Example: CONTROL_VALUE = 0x1
# Applicable / optional / ignored: Control only; ignored otherwise; HSIZE legal maximum is 2 for DW=32 or 3 for DW=64; other encodings are intentional corruption; HTRANS=0 is rejected to avoid unsafe early INCR8 termination; HTRANS=1 is allowed only inside a burst and yields NOT_INJECTED, not a comparator mismatch.
CONTROL_VALUE = 0x1

[delay]
# Purpose: Extra delay before the target request presentation.
# Data type: decimal integer or none.
# Valid values / range: 0 to 128.
# Unit: clock cycles.
# Bit width: 32-bit integer.
# Example: DELAY_CYCLES = 3
# Applicable / optional / ignored: Delay only; ignored otherwise; zero is a verified zero-delay reference, not an applied fault.
DELAY_CYCLES = 3

[trigger]
# Purpose: Select a logical request or exact nominal presentation cycle.
# Data type: enum.
# Valid values / range: transaction or cycle.
# Unit: none.
# Bit width: none.
# Example: TRIGGER_MODE = transaction
# Applicable / optional / ignored: Required in every mode.
TRIGGER_MODE = transaction

# Purpose: Common A/B workload ordinal, independent of arrival skew.
# Data type: decimal integer or none.
# Valid values / range: 1 to 8; 1 to 16 for mixed.
# Unit: AHB valid beat, 1-based.
# Bit width: 32-bit integer.
# Example: INJECT_AT_TRANSACTION = 5
# Applicable / optional / ignored: Required in transaction mode; must be none in cycle mode.
INJECT_AT_TRANSACTION = 5

# Purpose: Exact target nominal address-presentation edge before injected delay.
# Data type: decimal integer or none.
# Valid values / range: 0 to WATCHDOG_CYCLES-1; first rising edge after reset release is 0.
# Unit: clock cycles, 0-based.
# Bit width: 32-bit integer.
# Example: INJECT_AT_CYCLE = 0
# Applicable / optional / ignored: Required in cycle mode; must be none in transaction mode; no safe request at that edge means NOT_INJECTED.
INJECT_AT_CYCLE = none

# Purpose: Optional INCR8 beat consistency check.
# Data type: decimal integer or none.
# Valid values / range: 1 to 8, or none.
# Unit: burst beat, 1-based.
# Bit width: 32-bit integer.
# Example: INJECT_AT_BEAT = 5
# Applicable / optional / ignored: Optional value; key required; conflict is an error; none disables check.
INJECT_AT_BEAT = 5
